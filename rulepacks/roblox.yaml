# Hyperium Code-Audit — Roblox / Luau Rule Pack v1.1
# v1.1: tolerancia a espacios, match_scope (code/content) y reglas de
#       contexto reclasificadas como puntos de revision (severity low).
# match_scope: code = matchea sin comentarios ni literales.
#              content = matchea el texto crudo (URLs, literales).

rules:
  - id: RBX-BD-001
    title: Dynamic code execution via loadstring
    severity: critical
    category: security_misconfig
    cwe_id: CWE-94
    owasp_id: A03
    languages: [lua, luau]
    pattern: 'loadstring\s*[(]'
    match_scope: code
    description: loadstring executes arbitrary runtime code and is the standard payload delivery in Toolbox backdoors.
    remediation: Remove loadstring entirely. Never enable LoadStringEnabled.
    confidence: 0.95

  - id: RBX-BD-002
    title: Remote content fetched at runtime (HttpGet)
    severity: high
    category: security_misconfig
    cwe_id: CWE-829
    owasp_id: A08
    languages: [lua, luau]
    pattern: 'HttpGet\s*[(]'
    match_scope: code
    description: Fetching remote code or config at runtime enables post-publish payload swaps, especially combined with loadstring.
    remediation: Bundle required assets in the place file; allowlist and pin any external data source.
    confidence: 0.75

  - id: RBX-BD-003
    title: require() of external asset id
    severity: high
    category: security_misconfig
    cwe_id: CWE-829
    owasp_id: A08
    languages: [lua, luau]
    pattern: 'require\s*[(]\s*[0-9]'
    match_scope: code
    description: require() on a numeric asset id loads third-party module code you do not control — a common backdoor vector.
    remediation: Require only local ModuleScripts referenced by path.
    confidence: 0.85

  - id: RBX-BD-004
    title: Environment tampering via getfenv/setfenv
    severity: high
    category: security_misconfig
    cwe_id: CWE-913
    owasp_id: A08
    languages: [lua, luau]
    pattern: 'getfenv\s*[(]|setfenv\s*[(]'
    match_scope: code
    description: Environment manipulation is used to hide payloads, hook functions and evade simple detection.
    remediation: Remove getfenv/setfenv usage; legitimate game code rarely needs them.
    confidence: 0.8

  - id: RBX-BD-005
    title: Obfuscated payload via string.char
    severity: medium
    category: security_misconfig
    cwe_id: CWE-506
    owasp_id: A08
    languages: [lua, luau]
    pattern: 'string[.]char\s*[(]'
    match_scope: code
    description: Numeric string.char chains are the classic way to hide malicious strings from review.
    remediation: Decode and review the payload; replace with readable literals.
    confidence: 0.7

  - id: RBX-EXF-001
    title: Outbound HTTP POST may exfiltrate data
    severity: high
    category: security_misconfig
    cwe_id: CWE-200
    owasp_id: A01
    languages: [lua, luau]
    pattern: 'PostAsync\s*[(]|HttpPostAsync\s*[(]'
    match_scope: code
    description: Server-side POST to external URLs can leak player data, secrets or economy state.
    remediation: Allowlist destinations; never send player identifiers or tokens off-platform.
    confidence: 0.8

  - id: RBX-EXF-002
    title: Discord webhook endpoint in code
    severity: critical
    category: security_misconfig
    cwe_id: CWE-200
    owasp_id: A01
    languages: [lua, luau]
    pattern: 'discord[.]com/api/webhooks'
    match_scope: content
    description: Discord webhooks in game code are the standard exfiltration channel for backdoors and stolen data.
    remediation: Remove the webhook; rotate it immediately — assume it is compromised.
    confidence: 0.9

  - id: RBX-EXF-003
    title: Generic outbound request API
    severity: medium
    category: security_misconfig
    cwe_id: CWE-200
    owasp_id: A10
    languages: [lua, luau]
    pattern: 'RequestAsync\s*[(]'
    match_scope: code
    description: Low-level HTTP request API bypasses common HttpService review points.
    remediation: Use HttpService with an explicit allowlist and reviewed payloads.
    confidence: 0.7

  - id: RBX-TRUST-001
    title: RemoteEvent handler — server-side validation review
    severity: low
    category: security_misconfig
    cwe_id: CWE-20
    owasp_id: A04
    languages: [lua, luau]
    pattern: 'OnServerEvent\s*[:.]\s*Connect'
    match_scope: code
    description: "Review point, not a confirmed vulnerability: the presence of a handler does not prove missing validation. Verify type checks, range limits and rate limiting for every argument."
    remediation: Validate types, ranges and rate limits server-side before mutating state.
    impact: If unvalidated, client-controlled arguments enable exploits and item duplication.
    confidence: 0.5

  - id: RBX-TRUST-002
    title: RemoteFunction invocation — validation review
    severity: low
    category: security_misconfig
    cwe_id: CWE-20
    owasp_id: A04
    languages: [lua, luau]
    pattern: 'OnServerInvoke'
    match_scope: code
    description: "Review point, not a confirmed vulnerability: verify that all arguments are validated and that only required data is returned."
    remediation: Validate all arguments and return only what the client needs.
    impact: If unvalidated, input corrupts state or data leaks to clients.
    confidence: 0.5

  - id: RBX-ECON-001
    title: Purchase receipt handler — idempotency review
    severity: low
    category: security_misconfig
    cwe_id: CWE-841
    owasp_id: A04
    languages: [lua, luau]
    pattern: 'ProcessReceipt'
    match_scope: code
    description: "Review point, not a confirmed vulnerability: verify that grants are idempotent and persisted before returning PurchaseDecision."
    remediation: Record processed purchase ids; grant exactly once.
    impact: If not idempotent, purchase grants can duplicate.
    confidence: 0.5

  - id: RBX-ECON-002
    title: DataStore write — error handling review
    severity: low
    category: security_misconfig
    cwe_id: CWE-703
    owasp_id: A05
    languages: [lua, luau]
    pattern: 'SetAsync\s*[(]'
    match_scope: code
    description: "Review point, not a confirmed vulnerability: the handler may wrap this call elsewhere. Verify pcall, retry and update queueing."
    remediation: Wrap writes with pcall, retry with backoff and queue updates on failure.
    impact: If unhandled, failed writes silently lose player progress.
    confidence: 0.5

  - id: RBX-CFG-001
    title: LoadStringEnabled set to true
    severity: high
    category: security_misconfig
    cwe_id: CWE-94
    owasp_id: A05
    languages: [lua, luau]
    pattern: 'LoadStringEnabled\s*=\s*true'
    match_scope: code
    description: Enabling loadstring opens arbitrary code execution; attackers scan for games with it enabled.
    remediation: Keep LoadStringEnabled false and remove any code depending on it.
    confidence: 0.85

  - id: RBX-CFG-002
    title: Metatable usage — context review
    severity: low
    category: security_misconfig
    cwe_id: CWE-913
    owasp_id: A08
    languages: [lua, luau]
    pattern: 'getmetatable\s*[(]|setmetatable\s*[(]'
    match_scope: code
    description: "Review point, not a confirmed vulnerability: metatables are normal in Luau OOP, but they can hide malicious behavior. Review call sites."
    remediation: Limit metatable use to reviewed OOP patterns; audit call sites.
    impact: If abused, metatable hooks can mask runtime behavior changes.
    confidence: 0.4
