name: Roblox Security Scan
on:
  pull_request:
    paths: ["**/*.lua", "**/*.luau", "rulepacks/**"]
  push:
    branches: ["main"]

jobs:
  code-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned version
        run: pip install hyperium-code-audit==4.0.0
      - name: Scan Luau with Roblox rule pack
        id: scan
        continue-on-error: true
        run: |
          set +e
          code-audit scan . --custom-rules roblox --format sarif -o reports
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports
      - name: Restore gate status
        run: |
          code="${{ steps.scan.outputs.exit_code }}"
          if [ "$code" = "1" ]; then echo "findings at gate"; exit 1; fi
          if [ "$code" = "2" ]; then echo "operational error"; exit 2; fi
