name: Roblox Security Scan
on:
  pull_request:
    paths: ["**/*.lua", "**/*.luau", "rulepacks/**"]
  push:
    branches: [main]

jobs:
  code-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install hyperium-code-audit
      - name: Scan Luau with Roblox rule pack
        run: code-audit scan . --custom-rules rulepacks/roblox.yaml --format sarif -o reports
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/
